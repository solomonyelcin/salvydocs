name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Smart search: embeds every photo once (unchanged photos are reused). If this step fails the site still deploys.
      - name: Build photo search index
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock @xenova/transformers@2.17.2
          node scripts/build-index.mjs
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css app.js ai.js config.js _site/
          cp search-index.json _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
