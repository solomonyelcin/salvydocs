<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Drive Gallery</title>
<meta name="description" content="A fast, beautiful viewer for the photos, videos and documents in your Google Drive.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236d5efc'/%3E%3Ccircle cx='36' cy='38' r='9' fill='%23fff'/%3E%3Cpath d='M14 78l26-28 16 16 12-12 18 24z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sign-in screen -->
<section id="welcome" class="welcome">
  <div class="welcome-card">
    <div class="logo"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg></div>
    <h1>Your Drive, beautifully.</h1>
    <p>Browse photos, watch videos and read documents from your Google Drive in one fast, clean place. Read-only, and nothing leaves your browser.</p>
    <button id="signin" class="btn primary big">Connect Google Drive</button>
    <p id="config-warning" class="warn" hidden>Set your Google <code>CLIENT_ID</code> in <code>config.js</code> first. See the README.</p>
  </div>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span> Drive Gallery</div>
    <nav>
      <button class="nav active" data-view="folders"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>My Drive</button>
      <button class="nav" data-view="photos"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>Photos</button>
      <button class="nav" data-view="videos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Videos</button>
      <button class="nav" data-view="docs"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Documents</button>
      <button class="nav" data-view="starred"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Starred</button>
    </nav>
    <div class="spacer"></div>
    <div class="user" id="user"></div>
    <button id="signout" class="btn ghost small">Sign out</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menu" class="icon-btn mobile-only" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <form id="search-form" class="search" role="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Search your Drive  ( press / )" autocomplete="off">
      </form>
      <div class="tools">
        <select id="sort" aria-label="Sort">
          <option value="name">Name</option>
          <option value="modifiedTime desc">Newest</option>
          <option value="modifiedTime">Oldest</option>
          <option value="quotaBytesUsed desc">Largest</option>
        </select>
        <div class="seg" role="group" aria-label="Layout">
          <button id="layout-grid" class="icon-btn active" aria-label="Grid"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
          <button id="layout-list" class="icon-btn" aria-label="List"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        </div>
        <button id="theme" class="icon-btn" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
      </div>
    </header>

    <div class="crumbs" id="crumbs"></div>
    <div id="status" class="status" hidden></div>
    <div id="grid" class="grid"></div>
    <div id="sentinel" class="sentinel"></div>
  </main>
</div>

<!-- Viewer -->
<div id="viewer" class="viewer" hidden>
  <div class="viewer-bar">
    <div class="viewer-title" id="v-title"></div>
    <div class="viewer-actions">
      <a id="v-open" class="btn ghost small" target="_blank" rel="noopener">Open in Drive</a>
      <button id="v-close" class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <button id="v-prev" class="nav-arrow left" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="viewer-stage" id="v-stage"></div>
  <button id="v-next" class="nav-arrow right" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="viewer-count" id="v-count"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
